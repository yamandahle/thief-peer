# Private, local-only terms (PLAN.md ADR-5) -- never negotiated, never
# hashed, never shared with the Cop peer. Fill in the two REQUIRED values
# marked below before running `cli.py run`; everything else has a working
# default in code and only needs changing if you want to tune it.

[network]
my_port = 8801
# REQUIRED: the Cop peer's real, reachable MCP URL (localhost for a local
# test against your own second instance; a tunnel/public URL for a real
# match against an independently-running Cop process -- see PRD_5).
opponent_url = "http://127.0.0.1:8802/mcp"

[email]
# Match reports (ApiGatekeeper-routed Gmail send, PRD_7). Temporarily the
# user's own address for early testing -- change to the real grading
# recipient before a submission-relevant run.
recipient = "yamandahle@gmail.com"
# Path to the OAuth token created by the one-time Gmail browser-consent
# flow (Appendix א) -- gitignored, never commit the real file.
token_path = "token.json"

# This team's own known repo URLs (rule 49: "four links in both teams'
# JSON"). Never the opponent's -- there's no wire channel to learn theirs,
# and this repo never invents one (peer/runtime.py::PeerRuntime.repos).
[repos]
thief = "https://github.com/yamandahle/thief-peer"
cop = "https://github.com/Nagham1023/yamanagh-cop"

# Optional: [strategy] thief_class = "pkg.module:ClassName" to swap in a
# different BrainBase subclass (ADR-7); omitted here to use the shipped
# ThiefBrain (strategy/fleeing_brain.py).

# Optional: DOS-detector thresholds only (ADR-4, PRD_10 fix). The token
# bucket / retry / queue-depth Gatekeeper numbers are NOT here anymore --
# they're part of the shared, negotiated `rate_limiter_gatekeeper` block in
# game.json (Appendix F, identical on the Cop side), read directly from
# there by sdk.py. DOS-detector circuit-breaker thresholds have no
# equivalent shared field -- each side's own unilateral defense choice, not
# something to negotiate -- so they stay private/local here. Sensible
# defaults are already baked into sdk.py if this section is omitted.
[rate_limits]
dos_max_calls = 100
dos_window_seconds = 60
