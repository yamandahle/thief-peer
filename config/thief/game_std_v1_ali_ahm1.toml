# Warm-up match config for team ali-ahm1 -- a separate file so
# game_std_v1_remote.toml (yanell11's own reserved config) and
# game_std_v1_other_team.toml (moamteam's own) stay completely untouched.

[board_and_agents]
grid_size = 7
thief_start = [0, 0]

[world]
hint_max_words = 15

[movement_and_barriers]
max_moves = 35
survival_threshold = 35

[pheromones]
pheromone_center_intensity = 0.9
pheromone_decay = 0.1

[network]
my_port = 8801
opponent_url = "https://sputter-petted-fanciness.ngrok-free.dev/mcp"
opponent_protocol = "std_v1"
opponent_group_id = "ali-ahm1"
public_url = "https://sequence-burke-outlets-occur.trycloudflare.com/mcp"
