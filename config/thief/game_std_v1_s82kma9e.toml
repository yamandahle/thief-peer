# Match config for team s82kma9e -- a separate file so the other
# opponents' own reserved configs stay completely untouched.

[board_and_agents]
grid_size = 7
thief_start = [0, 0]

[world]
hint_max_words = 15

[movement_and_barriers]
max_moves = 35
survival_threshold = 35

[pheromones]
pheromone_center_intensity = 0.9
pheromone_decay = 0.1

[network]
my_port = 8801
opponent_url = "https://velvet-previous-configure-julia.trycloudflare.com/mcp"
opponent_protocol = "std_v1"
opponent_group_id = "s82kma9e"
public_url = "https://splotchy-bronco-nature.ngrok-free.dev/mcp"
# Same relay every other opponent already verified locally -- yamanagh-cop's
# relay process doesn't care which opponent it's serving, no restart needed.
cop_relay_url = "http://127.0.0.1:8901/mcp"

[network_and_league]
response_timeout_sec = 180.0
watchdog_timeout_sec = 180.0

[email]
recipient = "mhmdabad10@gmail.com"
token_path = "token.json"
# s82kma9e's own stated convention for a future counted report: lecturer
# only, no opponent CC. Only affects counted sends -- this friendly run
# never CCs the lecturer either way (M#52's own framing, enforced in code).
cc_opponent_on_counted_report = false

[repos]
thief = "https://github.com/yamandahle/thief-peer"
cop = "https://github.com/Nagham1023/yamanagh-cop"

[std_v1]
group_id = "yamanagh"
members = ["Nagham Manasra", "Yaman Dahle"]
# s82kma9e's declared terms.setting is "Haifa", not our current default
# ("New York", set for a different opponent) -- every other one of the 14
# fields is identical (confirmed by an independent terms-SHA256 match), so
# this per-opponent override is the only difference from the shared default.
terms_path = "config/thief/interop_spec_terms_s82kma9e.json"
